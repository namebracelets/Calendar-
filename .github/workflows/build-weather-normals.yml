# Builds weather-normals.json (30-year typical weather for each calendar date) on GitHub's servers
# and saves it to the branch. Runs when the build script or this file changes, or by hand from the
# Actions tab ("Run workflow"). Free for public repositories; no keys needed.
name: Build weather normals

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-weather-normals.mjs
      - .github/workflows/build-weather-normals.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download 30 years of Open-Meteo archive data and build the file
        run: node scripts/build-weather-normals.mjs
      - name: Save weather-normals.json to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add weather-normals.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update weather-normals.json (30-year typical weather)"
          git push
